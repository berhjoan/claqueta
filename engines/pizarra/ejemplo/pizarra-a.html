<template>
  <style>
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0806; }
    #pa-lienzo { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  </style>
  <div data-hf-id="hf-xdnv" id="root" data-composition-id="pizarra-a" data-start="0" data-duration="7.6" data-width="1080" data-height="1920">
    <canvas data-hf-id="hf-pqw9" id="pa-lienzo" class="clip" data-start="0" data-duration="7.6" data-track-index="0" width="1080" height="1920"></canvas>
  </div>
  <script type="module">
    import { montar } from "./assets/pizarra/board.js";
    // Escena A: se dibuja con el protocolo hf-seek, que entrega el tiempo global.
    const ID = "pizarra-a", D = 7.6, render = montar(document.getElementById("pa-lienzo"));
    const tl = gsap.timeline({ paused: true });
    tl.set({}, {}, D);
    window.addEventListener("hf-seek", (e) => { if (e.detail.time < D) render(e.detail.time); });
    render(0);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  </script>
</template>
