<template>
  <style>
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0806; }
    #pb-lienzo { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  </style>
  <div data-hf-id="hf-bflu" id="root" data-composition-id="pizarra-b" data-start="0" data-duration="7.4" data-width="1080" data-height="1920">
    <canvas data-hf-id="hf-ailc" id="pb-lienzo" class="clip" data-start="0" data-duration="7.4" data-track-index="0" width="1080" height="1920"></canvas>
  </div>
  <script type="module">
    import { montar } from "./assets/pizarra/board.js";
    // Escena B: empieza en 7.6 s y se dibuja con el reloj proxy de GSAP, que entrega el tiempo local de la escena.
    const ID = "pizarra-b", D = 7.4, INICIO = 7.6, render = montar(document.getElementById("pb-lienzo"));
    const tl = gsap.timeline({ paused: true }), clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => render(INICIO + clock.t) }, 0);
    render(INICIO);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  </script>
</template>
