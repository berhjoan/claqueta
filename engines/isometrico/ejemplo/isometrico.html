<template>
  <style>
    #iso-lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #iso-letra { position: absolute; left: 0; top: 0; opacity: 0; font-family: "Sora", sans-serif; font-weight: 700; font-size: 16px; }
  </style>
  <div id="root" data-composition-id="isometrico" data-start="0" data-duration="15" data-width="1080" data-height="1920" style="position: absolute; inset: 0; overflow: hidden;">
    <canvas id="iso-lienzo" class="clip" data-start="0" data-duration="15" data-track-index="0" data-layout-allow-overflow data-layout-allow-occlusion width="1080" height="1920"></canvas>
    <span id="iso-letra" aria-hidden="true">áéíóúñ¿¡ÁÉÍÓÚÑ</span>
  </div>
  <script type="module">
    import { montar } from "./assets/isometrico/mundo.js";
    // El reloj es un proxy de GSAP: entrega el tiempo de la escena. Nunca requestAnimationFrame ni Date.
    const ID = "isometrico", D = 15, render = montar(document.getElementById("iso-lienzo"));
    const tl = gsap.timeline({ paused: true }), clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
    render(0);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  </script>
</template>
