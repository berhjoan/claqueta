<!DOCTYPE html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Película isométrica</title>
    <script src="assets/lib/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fonts/fuentes.css">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0806; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0806; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="el-isometrico" class="scene" data-composition-id="isometrico" data-composition-src="compositions/isometrico.html" data-start="0" data-duration="15" data-track-index="1" data-track-kind="graphics"></div>
      <audio id="mezcla" src="assets/audio/mezcla.wav" data-start="0" data-duration="15" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
