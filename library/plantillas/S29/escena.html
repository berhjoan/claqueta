  <script>
    (function () {
      const raiz = document.getElementById("pl-s29");
      const cs = raiz.querySelector("#pl-s29-suelo").getContext("2d");
      const ce = raiz.querySelector("#pl-s29-eq").getContext("2d");
      const cst = raiz.querySelector("#pl-s29-estrellas").getContext("2d");
      const titulo = raiz.querySelector("#pl-s29-titulo");
      const estilo = getComputedStyle(raiz);
      const color = (n, r) => estilo.getPropertyValue(n).trim() || r;
      // Estrellas con semilla fija: el cielo no cambia entre renders.
      const azar = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const rnd = azar(2929);
      for (let i = 0; i < 90; i++) {

      ajustar();

      function suelo(t) {

        cs.clearRect(0, 0, 1080, 1040);
        cs.fillStyle = "#12002B"; cs.fillRect(0, 0, 1080, 1040);

        for (let k = 0; k < 14; k++) {
          const z = k + 1 - fase;
          const y = 1040 * Math.pow(z / 14, 2.2);
          cs.globalAlpha = Math.min(1, y / 60);
          cs.beginPath(); cs.moveTo(0, y); cs.lineTo(1080, y); cs.stroke();
        }
        cs.globalAlpha = 1;

      // Ecualizador sintético: sumas de senos que dependen de t, con una envolvente que sube y se queda.
      function eq(t, env) {

        if (env <= 0) return;

          ce.fillRect(120 + i * 35, 872 - h, 24, h);
