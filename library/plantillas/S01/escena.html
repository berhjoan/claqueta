<template>
  <style>

    #pl-s01 { position: absolute; inset: 0; overflow: hidden; background: var(--fondo, #1A0B2E); color: var(--tinta, #F7E9FF); font-family: var(--display, "Sora"), sans-serif; }
    #pl-s01-brillo { position: absolute; inset: 0; background:
      radial-gradient(48% 30% at 50% 33%, color-mix(in srgb, var(--acento, #FF6FB5) 22%, transparent) 0%, transparent 70%),
      radial-gradient(90% 55% at 50% 38%, var(--superficie, #2A1446) 0%, var(--fondo, #1A0B2E) 78%); }
    #pl-s01-lienzo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #pl-s01-kicker { position: absolute; left: 72px; right: 72px; top: 262px; font-weight: 700; font-size: 46px; letter-spacing: .16em; text-transform: uppercase; color: var(--acento, #FF6FB5); white-space: nowrap; overflow: hidden; }
    #pl-s01-titulo { position: absolute; left: 90px; right: 90px; top: 960px; height: 320px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-weight: 800; line-height: 1.08; letter-spacing: -.01em; color: var(--tinta, #F7E9FF); text-shadow: 0 0 36px color-mix(in srgb, var(--acento, #FF6FB5) 55%, transparent); }
    #pl-s01-titulo span { display: block; white-space: nowrap; }
    #pl-s01-lectura { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  </style>

  <div id="pl-s01" data-composition-id="S01" data-start="0" data-duration="4" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"kicker","type":"string","label":"Rótulo","default":"Nube de puntos","maxLength":24},
      {"id":"titulo","type":"string","label":"Título (hasta dos líneas)","default":"Del caos nace la forma","maxLength":22}
    ]'>
    <div id="pl-s01-brillo"></div>
    <canvas id="pl-s01-lienzo" width="1080" height="1920" data-layout-allow-overflow></canvas>
    <div id="pl-s01-kicker" data-var-text="kicker">Nube de puntos</div>
    <div id="pl-s01-titulo"></div>
    <div id="pl-s01-lectura" data-var-text="titulo">Del caos nace la forma</div>
  </div>

  <script>
    (function () {
      var W = 1080, H = 1920, CX = 540, CY = 640;
      var vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
      var TITULO = (typeof vars.titulo === "string" && vars.titulo.length) ? vars.titulo : "Del caos nace la forma";
      var root = document.getElementById("pl-s01"), cv = document.getElementById("pl-s01-lienzo"), ctx = cv.getContext("2d");
      function cor(css) { var s = document.createElement("span"); s.style.color = css; root.appendChild(s); var c = getComputedStyle(s).color; root.removeChild(s); return c; }
      var C_AC = cor("var(--acento, #FF6FB5)"), C_SE = cor("var(--segundo, #9B5DE5)"), C_TI = cor("var(--tinta, #F7E9FF)");
      var PAL = [C_AC, C_AC, C_AC, C_SE, C_SE, C_TI];

      function lcg(seed) { var s = seed >>> 0; return function () { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 4294967296; }; }
      function eo3(x) { return 1 - Math.pow(1 - x, 3); }
      function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
      function backOut(x) { var c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

      // Título en una o dos líneas, ajustado al ancho; se vuelve a calcular cuando la fuente termina de cargar
      var tituloEl = document.getElementById("pl-s01-titulo");
      var LINEAS = [], TAM = 120;
      function partir(t) {
        var pal = t.trim().split(/\s+/);
        if (pal.length < 2 || t.length <= 11) return [t.trim()];
        var mejor = null, mejorD = 1e9;
        for (var i = 1; i < pal.length; i++) { var a = pal.slice(0, i).join(" "), b = pal.slice(i).join(" "), d = Math.abs(a.length - b.length); if (d < mejorD) { mejorD = d; mejor = [a, b]; } }
        return mejor;
      }
      var particulas = [];
      function construir() {
        LINEAS = partir(TITULO);
        var m = document.createElement("canvas").getContext("2d");
        var fam = getComputedStyle(tituloEl).fontFamily || "Sora";
        m.font = "800 100px " + fam;
        var anch = Math.max.apply(null, LINEAS.map(function (l) { return m.measureText(l).width; })) / 100;
        TAM = Math.min(150, 880 / Math.max(0.5, anch));
        tituloEl.innerHTML = ""; tituloEl.style.fontSize = TAM + "px";
        LINEAS.forEach(function (l) { var s = document.createElement("span"); s.textContent = l; tituloEl.appendChild(s); });
        // Trama del texto: se dibuja una vez fuera de pantalla y cada celda iluminada es un destino
        var off = document.createElement("canvas"); off.width = W; off.height = H;
        var oc = off.getContext("2d", { willReadFrequently: true });
        oc.font = "800 " + TAM + "px " + fam; oc.textAlign = "center"; oc.textBaseline = "middle"; oc.fillStyle = "#fff";
        var cy = 960 + 160, paso = TAM * 1.08, y0 = cy - (LINEAS.length - 1) * paso / 2;
        LINEAS.forEach(function (l, i) { oc.fillText(l, W / 2, y0 + i * paso); });
        var datos = oc.getImageData(0, 0, W, H).data, celdas = [], PASO = 6;
        for (var y = 900; y < 1300; y += PASO) for (var x = 40; x < W - 40; x += PASO) if (datos[(y * W + x) * 4 + 3] > 127) celdas.push(x, y);
        var r = lcg(0x5eed01), P = [];
        // Grupo F: figura radial (anillos y radios). Nace como bola densa en el centro y se abre.
        var anillos = 8;
        for (var k = 0; k < anillos; k++) {
          var rad = 36 + k * 36, n = Math.round(6.2832 * rad / 17);
          for (var j = 0; j < n; j++) { var a = j / n * 6.2832 + k * 0.21; P.push({ g: 0, tx: CX + Math.cos(a) * rad, ty: CY + Math.sin(a) * rad, rk: rad }); }
        }
        for (var s = 0; s < 14; s++) for (var q = 0; q < 12; q++) { var aa = s / 14 * 6.2832 + 0.1, rr = 60 + q * 21; P.push({ g: 0, tx: CX + Math.cos(aa) * rr, ty: CY + Math.sin(aa) * rr, rk: rr }); }
        // Grupo T: el título, con tope de 1600 puntos
        var nT = celdas.length / 2, tope = 1600, keep = Math.min(1, tope / Math.max(1, nT));
        for (var c = 0; c < celdas.length; c += 2) if (r() < keep) P.push({ g: 1, tx: celdas[c] + (r() - 0.5) * 2, ty: celdas[c + 1] + (r() - 0.5) * 2, rk: 0 });
        // Grupo A: estrellas de fondo que derivan despacio y se frenan
        for (var e = 0; e < 520; e++) P.push({ g: 2, tx: r() * W, ty: r() * H, rk: 0, vx: (r() - 0.5) * 26, vy: (r() - 0.5) * 26 });
        // Atributos comunes con semilla: origen disperso, retraso, tamaño y color
        P.forEach(function (p) {
          var ang = r() * 6.2832, dist = 500 + r() * 900;
          p.sx = CX + Math.cos(ang) * dist * 0.9; p.sy = CY + 250 + Math.sin(ang) * dist;
          p.col = PAL[Math.floor(r() * PAL.length)]; p.rad = 1.6 + r() * 2.8; p.u = r(); p.w = r() * 6.2832;
          p.dem = p.g === 1 ? clamp((p.tx - 40) / (W - 80)) * 0.85 + r() * 0.2 : r() * 0.3;
        });
        particulas = P;
      }
      construir();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { construir(); if (typeof reloj === "number") pintar(reloj); });

      function pintar(t) {
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = "lighter";
        var atenuar = 1 - 0.6 * clamp((t - 1.9) / 0.5);          // las partículas del título ceden ante el texto nítido
        for (var i = 0; i < particulas.length; i++) {
          var p = particulas[i], x, y, a = 1, rd = p.rad;
          if (p.g === 0) {
            var u1 = clamp((t - p.dem * 0.4) / 1.0);                         // 0–1,0 s: se concentran en el centro
            var u2 = clamp((t - 1.0 - p.rk / 300 * 0.35 - p.dem * 0.15) / 1.0); // 1,0–2,6 s: se abren en anillos
            var cx = CX + (p.tx - CX) * 0.05, cy = CY + (p.ty - CY) * 0.05;
            var e1 = eo3(u1), e2 = backOut(u2);
            var ax = p.sx + (cx - p.sx) * e1, ay = p.sy + (cy - p.sy) * e1;
            x = ax + (p.tx - ax) * e2; y = ay + (p.ty - ay) * e2;
            a = 0.35 + 0.65 * clamp(t * 6);
          } else if (p.g === 1) {
            var u = clamp((t - 0.2 - p.dem * 0.9) / 0.85), e = eo3(u);
            x = p.sx + (p.tx - p.sx) * e; y = p.sy + (p.ty - p.sy) * e;
            a = (0.15 + 0.85 * clamp(u * 3)) * atenuar;
          } else {
            var tt = Math.min(t, 3.0), fr = tt - 0.07 * tt * tt;               // deriva que se frena hasta quedar quieta
            x = p.tx + p.vx * fr; y = p.ty + p.vy * fr;
            a = 0.18 + 0.32 * (0.5 + 0.5 * Math.sin(p.w + tt * 2.1));
            rd = p.rad * 0.8;
          }
          ctx.globalAlpha = a; ctx.fillStyle = p.col;
          ctx.beginPath(); ctx.arc(x, y, rd, 0, 6.2832); ctx.fill();
          if (p.u > 0.72 && p.g !== 2) { ctx.globalAlpha = a * 0.22; ctx.beginPath(); ctx.arc(x, y, rd * 3.2, 0, 6.2832); ctx.fill(); }
        }
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
      }
      var reloj = 0, rel = {};
      Object.defineProperty(rel, "t", { configurable: true, get: function () { return reloj; }, set: function (x) { reloj = x; pintar(x); } });
      var tl = gsap.timeline({ paused: true });
      tl.to(rel, { t: 4, duration: 4, ease: "none" }, 0);
      tl.fromTo("#pl-s01-kicker", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo("#pl-s01-titulo", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.55);
      pintar(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["S01"] = tl;
    })();
  </script>
</template>
