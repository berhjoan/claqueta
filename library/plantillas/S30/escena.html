  <script>
    (function () {

      const lienzo = raiz.querySelector("#pl-s30-lienzo"), g = lienzo.getContext("2d");
      const azar = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

        const v = rnd() < 0.5 ? 0 : 255, a = Math.floor(rnd() * rnd() * 70);

      }
      ajustar();
      // Todo lo que se mueve solo (grano, rayones, ventanilla) sale de t, a 12 cuadros por segundo.
      function textura(t) {
        ajustar();
        const k = Math.floor(Math.min(t, 3.2) * 12);
        g1.style.backgroundPosition = ((k * 37) % 256) + "px " + ((k * 91) % 256) + "px";
        g2.style.backgroundPosition = ((k * 151 + 40) % 256) + "px " + ((k * 59 + 17) % 256) + "px";

      [0.5, 0.95, 1.4].forEach((t, i) => {

      });

      tl.fromTo(["#pl-s30-titulo", "#pl-s30-regla", "#pl-s30-sub"], { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out", stagger: 0.18 }, 1.65);
      tl.fromTo("#pl-s30-marco", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.55);
      tl.to({}, { duration: 4 }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["S30"] = tl;
    })();
