      // Bloques de datos corruptos al fondo, con semilla fija: llenan los 1920 px sin tocar el texto.
      const azar = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

        b.style.cssText = "left:" + Math.floor(rnd() * 1080) + "px;top:" + Math.floor(rnd() * 1920) + "px;width:" + ancho + "px;height:" + [6, 12, 24][Math.floor(rnd() * 3)] + "px;background:" + colores[Math.floor(rnd() * 3)] + ";opacity:" + (0.05 + rnd() * 0.1).toFixed(2);

      const tachado = document.getElementById("pl-s28-tachado-w");

        const t1 = (document.getElementById("pl-s28-b").textContent || "").trim();
        if (t1 !== u1) { u1 = t1; fantasma.style.fontSize = Math.max(100, Math.min(520, Math.floor(1000 / (largo(t1) * 0.62)))) + "px"; titulo.style.fontSize = Math.max(90, Math.min(260, Math.floor(900 / (largo(t1) * 0.66)))) + "px"; }
        const t2 = (document.getElementById("pl-s28-tachado").textContent || "").trim();
        if (t2 !== u2) { u2 = t2; tachado.style.fontSize = Math.max(80, Math.min(170, Math.floor(880 / (largo(t2) * 0.66)))) + "px"; }
      }
      ajustar();
      const tl = gsap.timeline({ paused: true });

      // Fallo RGB: llega con los canales separados y se recupera en cinco cuadros (S28).

          tl.set("#pl-s28-c", { x: c * a, y: i < 4 ? 6 : 0 }, t);

        [[300, 120, -44, "#ff0055", 0.64], [820, 24, 37, "#00f0ff", 0.63], [560, 40, -40, "#ffffff", 0.7], [1010, 70, 28, "#00f0ff", 0.6]],
