  <script>
    (function () {

      function poli(pts) { return "M" + pts.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("L"); }
      var GEN = {
        elipse: function (a, r) { var cx = a[0], cy = a[1], rx = a[2], ry = a[3], pts = [], n = 54, ini = -2.4, vuelta = 6.28 * 1.1;

        ondulada: function (a, r) { var x0 = a[0], x1 = a[1], y = a[2], amp = a[3], pts = [], n = 30;

          return poli(pts); },
        flecha: function (a, r) { var x0 = a[0], y0 = a[1], x1 = a[2], y1 = a[3], cu = a[4], pts = [], n = 22, mx = (x0 + x1) / 2 + cu[0], my = (y0 + y1) / 2 + cu[1];

          var tx = x1 - (0.9 * mx + 0.1 * x1), ty = y1 - (0.9 * my + 0.1 * y1), L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
          var h1 = [x1 - tx * 46 + ty * 24 + (r() - 0.5) * 3, y1 - ty * 46 - tx * 24 + (r() - 0.5) * 3], h2 = [x1 - tx * 46 - ty * 24 + (r() - 0.5) * 3, y1 - ty * 46 + tx * 24 + (r() - 0.5) * 3];

        p.setAttribute("stroke-dasharray", "1 1"); p.setAttribute("stroke-dashoffset", "1");

        } };

        TRAZOS.forEach(function (z) { z.rebuild(); });
        if (typeof reloj === "number") pintar(reloj);
      }

      trazo("elipse", function () { return [540, 955, CLAVE.w / 2 + 56, Math.max(84, CLAVE.fs * 0.64)]; }, AC, 9, 1.0, 0.45, 1);
      trazo("ondulada", function () { return [540 - CLAVE.w / 2, 540 + CLAVE.w / 2, 955 + Math.max(84, CLAVE.fs * 0.64) + 24, 8]; }, SE, 8, 1.45, 0.4, 2);
