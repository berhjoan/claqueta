<template>
  <style>

    #pl-raur { position: absolute; inset: 0; overflow: hidden; background: var(--fondo, #04060C); color: var(--tinta, #EEF7F3); }
    /* Si el shader no llega a cargarse, esta capa deja un cuadro digno con la misma paleta */
    #pl-raur-reserva { position: absolute; inset: 0; background: radial-gradient(80% 40% at 50% 8%, color-mix(in srgb, var(--acento, #5EEAB0) 35%, transparent), transparent 70%), var(--fondo, #04060C); }
    #pl-raur-shader { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block;  }
    #pl-raur-estrellas { position: absolute; left: 0; top: 0; width: 3px; height: 3px; border-radius: 50%; background: transparent; }
    #pl-raur-bosque { position: absolute; left: 0; bottom: 0; width: 1080px; height: 330px; }
    #pl-raur-kicker { position: absolute; left: 72px; right: 72px; top: 262px; text-align: center; font-family: var(--cuerpo, "Manrope"), sans-serif; font-weight: 800; font-size: 44px; letter-spacing: .22em; text-transform: uppercase; color: var(--acento, #5EEAB0); white-space: nowrap; }
    #pl-raur-titulo { position: absolute; left: 72px; right: 72px; top: 940px; text-align: center; font-family: var(--display, "Fraunces"), serif; font-weight: 700; font-size: 118px; line-height: 1.04; letter-spacing: -.015em; text-wrap: balance; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
    #pl-raur-sub { position: absolute; left: 72px; right: 72px; top: 1198px; text-align: center; font-family: var(--cuerpo, "Manrope"), sans-serif; font-weight: 500; font-size: 46px; line-height: 1.2; color: color-mix(in srgb, var(--tinta, #EEF7F3) 84%, transparent); text-shadow: 0 2px 20px rgba(0,0,0,.7); }
  </style>

  <div id="pl-raur" data-composition-id="R-aurora" data-start="0" data-duration="4" data-width="1080" data-height="1920" data-requires-webgpu
    data-composition-variables='[{"id": "kicker", "type": "string", "label": "Rótulo", "default": "Luz del norte", "maxLength": 24}, {"id": "titulo", "type": "string", "label": "Título", "default": "Cortinas de luz", "maxLength": 22}, {"id": "subtitulo", "type": "string", "label": "Subtítulo", "default": "Un cielo que nunca se repite", "maxLength": 34}]'>
    <div id="pl-raur-reserva"></div>
    <canvas id="pl-raur-shader" data-shader="Aurora" width="1080" height="1920"></canvas>
    <div id="pl-raur-estrellas" data-layout-allow-overflow></div>
    <svg id="pl-raur-bosque" viewBox="0 0 1080 330" preserveAspectRatio="none" data-layout-allow-overflow></svg>
    <div id="pl-raur-kicker" data-var-text="kicker">Luz del norte</div>
    <div id="pl-raur-titulo" data-var-text="titulo">Cortinas de luz</div>
    <div id="pl-raur-sub" data-var-text="subtitulo">Un cielo que nunca se repite</div>
  </div>

  <script>
    (function () {
      var cv = document.getElementById("pl-raur-shader");
      var raiz = cv.closest("[data-composition-id]");
      function cor(css) { var s = document.createElement("span"); s.style.color = css; raiz.appendChild(s); var c = getComputedStyle(s).color; raiz.removeChild(s); return c; }
      function hex(css) { var m = cor(css).match(/[\d.]+/g); return "#" + [0, 1, 2].map(function (i) { return ("0" + Math.round(+m[i]).toString(16)).slice(-2); }).join(""); }
      function mezcla(a, b, t) { var A = a.match(/\w\w/g).map(function (x) { return parseInt(x, 16); }), B = b.match(/\w\w/g).map(function (x) { return parseInt(x, 16); }); return "#" + A.map(function (v, i) { return ("0" + Math.round(v + (B[i] - v) * t).toString(16)).slice(-2); }).join(""); }

      // Propiedades del shader tomadas de la paleta (hex), calculadas una vez al montar
      var C = { fondo: hex("var(--fondo, #04060C)"), tinta: hex("var(--tinta, #EEF7F3)"), acento: hex("var(--acento, #5EEAB0)"), segundo: hex("var(--segundo, #8F6BFF)"), superficie: hex("var(--superficie, #0B1220)") };
      cv.setAttribute("data-shader-props", JSON.stringify({ colorA: C.segundo, colorB: C.acento, colorC: mezcla(C.acento, C.segundo, 0.45), intensity: 100, height: 200, balance: 45, speed: 3, waviness: 70, curtainCount: 4, center: { x: 0.5, y: 0 } }));

      // Tiempo del shader = tiempo local de la escena + un desfase que elige un buen primer cuadro; se queda quieto tras 3.0 s
      var host = raiz.parentElement ? raiz.parentElement.closest("[data-composition-src]") : null;
      cv.__mapTime = function (tg) { var st = host ? (parseFloat(host.getAttribute("data-start")) || 0) : 0; return 3.0 + Math.min(Math.max(0, tg - st), 3.0); };

      // El motor se carga una vez; cada escena le pasa su canvas y espera a que termine de arrancar
      window.__hfShaderManual = true;
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["pl-raur"] = new Promise(function (res) {
        function montar() {
          try { window.__hfShaderMount(cv); Promise.resolve(window.__hf.buildReady["shaders" + window.__hfShaderN]).then(res, res); } catch (e) { res(); }
        }
        if (window.__hfShaderMount) { montar(); return; }
        var s = document.createElement("script"); s.src = "assets/lib/shaders.iife.js"; s.async = false;
        s.onload = montar; s.onerror = function () { res(); };
        document.head.appendChild(s);
      });

      // Estrellas con semilla fija y un bosque de pinos al pie: el mundo del estilo llena los 1920 px
      var s0 = 11; function rnd() { s0 = (Math.imul(1664525, s0) + 1013904223) >>> 0; return s0 / 4294967296; }
      var sombras = []; for (var i = 0; i < 90; i++) { var y = 900 + rnd() * 1000; sombras.push(Math.round(rnd() * 1080) + "px " + Math.round(y) + "px 0 " + (rnd() < 0.2 ? 1 : 0) + "px rgba(255,255,255," + (0.25 + rnd() * 0.6).toFixed(2) + ")"); }
      document.getElementById("pl-raur-estrellas").style.boxShadow = sombras.join(",");
      var bosque = document.getElementById("pl-raur-bosque"), pts = "0,330 ";
      for (var x = -20; x < 1100; x += 38) { var h = 120 + rnd() * 150; pts += (x) + "," + (330 - 40) + " " + (x + 19) + "," + (330 - h) + " " + (x + 38) + "," + (330 - 40) + " "; }
      pts += "1100,330";
      bosque.innerHTML = '<polygon points="' + pts + '" fill="#02040A"/>';
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#pl-raur-kicker", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo("#pl-raur-titulo", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.3);
      tl.fromTo("#pl-raur-sub", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.7);
      tl.fromTo("#pl-raur-bosque", { y: 90 }, { y: 0, duration: 0.9, ease: "power3.out" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["R-aurora"] = tl;
    })();
  </script>
</template>
