<template>
  <style>

    #pl-ldk { position: absolute; inset: 0; overflow: hidden; background: var(--fondo, #09090D); color: var(--tinta, #A7A6A8); font-family: var(--display, "Sora"), sans-serif; }
    #pl-ldk-fondo { position: absolute; inset: 0; background:
      radial-gradient(70% 36% at 50% 14%, color-mix(in srgb, var(--acento, #DFAA7B) 15%, transparent) 0%, transparent 72%),
      radial-gradient(80% 40% at 50% 98%, color-mix(in srgb, var(--segundo, #9EC0E4) 12%, transparent) 0%, transparent 70%),
      linear-gradient(180deg, color-mix(in srgb, var(--fondo, #09090D) 80%, #20202a) 0%, var(--fondo, #09090D) 60%); }
    /* Retícula fina de 60 px: todo se mueve sobre ella */
    #pl-ldk-reticula { position: absolute; inset: 0; background-image:
      linear-gradient(color-mix(in srgb, var(--tinta, #A7A6A8) 9%, transparent) 2px, transparent 2px),
      linear-gradient(90deg, color-mix(in srgb, var(--tinta, #A7A6A8) 9%, transparent) 2px, transparent 2px);
      background-size: 60px 60px; background-position: 0 0;
      -webkit-mask-image: radial-gradient(100% 70% at 50% 40%, #000 20%, transparent 100%); mask-image: radial-gradient(100% 70% at 50% 40%, #000 20%, transparent 100%); }

    #pl-ldk-kicker { position: absolute; left: 72px; right: 72px; top: 264px; font-family: var(--datos, "JetBrains Mono"), monospace; font-weight: 600; font-size: 44px; letter-spacing: .16em; text-transform: uppercase; color: var(--acento, #DFAA7B); white-space: nowrap; overflow: hidden; }
    #pl-ldk-titulo { position: absolute; left: 72px; right: 72px; top: 336px; font-weight: 600; font-size: 108px; line-height: 1.06; letter-spacing: -.035em; color: color-mix(in srgb, var(--tinta, #A7A6A8) 25%, #ffffff); text-wrap: balance; }
    #pl-ldk-sub { position: absolute; left: 72px; right: 72px; top: 570px; font-weight: 400; font-size: 46px; line-height: 1.2; color: var(--tinta, #A7A6A8); white-space: nowrap; overflow: hidden; }

    #pl-ldk-ventana { position: absolute; left: 72px; top: 690px; width: 936px; height: 560px; border-radius: 24px; background: linear-gradient(180deg, color-mix(in srgb, var(--superficie, #1B1B1F) 92%, #ffffff 4%), var(--superficie, #1B1B1F)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--tinta, #A7A6A8) 20%, transparent), 0 50px 120px rgba(0,0,0,.7), 0 0 90px color-mix(in srgb, var(--acento, #DFAA7B) 10%, transparent); overflow: hidden; }
    #pl-ldk-barra { position: absolute; left: 0; right: 0; top: 0; height: 60px; border-bottom: 2px solid color-mix(in srgb, var(--tinta, #A7A6A8) 16%, transparent); }
    .pl-ldk-punto { position: absolute; top: 22px; width: 16px; height: 16px; border-radius: 50%; background: color-mix(in srgb, var(--tinta, #A7A6A8) 35%, transparent); }
    #pl-ldk-barra-linea { position: absolute; left: 180px; top: 18px; width: 380px; height: 24px; border-radius: 12px; background: color-mix(in srgb, var(--tinta, #A7A6A8) 12%, transparent); }
    #pl-ldk-lateral { position: absolute; left: 0; top: 60px; bottom: 0; width: 180px; border-right: 2px solid color-mix(in srgb, var(--tinta, #A7A6A8) 14%, transparent); }
    .pl-ldk-item { position: absolute; left: 24px; width: 132px; height: 30px; border-radius: 8px; background: color-mix(in srgb, var(--tinta, #A7A6A8) 14%, transparent); }
    #pl-ldk-sel { position: absolute; left: 12px; width: 156px; height: 54px; border-radius: 12px; background: color-mix(in srgb, var(--acento, #DFAA7B) 22%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--acento, #DFAA7B) 70%, transparent); }
    .pl-ldk-ficha { position: absolute; width: 168px; height: 140px; border-radius: 16px; background: color-mix(in srgb, var(--tinta, #A7A6A8) 7%, var(--superficie, #1B1B1F)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--tinta, #A7A6A8) 12%, transparent); }
    .pl-ldk-glifo { position: absolute; left: 24px; top: 24px; width: 54px; height: 54px; border-radius: 14px; }
    .pl-ldk-linea { position: absolute; left: 24px; height: 12px; border-radius: 6px; background: color-mix(in srgb, var(--tinta, #A7A6A8) 24%, transparent); }
    #pl-ldk-foco { position: absolute; width: 180px; height: 152px; border-radius: 20px; box-shadow: 0 0 0 4px var(--acento, #DFAA7B), 0 0 50px color-mix(in srgb, var(--acento, #DFAA7B) 55%, transparent); opacity: 0; }
    #pl-ldk-cursor { position: absolute; left: 0; top: 0; width: 56px; height: 64px; filter: drop-shadow(0 8px 12px rgba(0,0,0,.6)); }
    #pl-ldk-chip { position: absolute; left: 0; top: 0; padding: 14px 26px; border-radius: 40px; background: var(--acento, #DFAA7B); color: var(--fondo, #09090D); font-weight: 700; font-size: 44px; line-height: 1.1; white-space: nowrap; box-shadow: 0 16px 40px rgba(0,0,0,.5); transform-origin: 0 100%; opacity: 0; }
    #pl-ldk-reflejo { position: absolute; left: 72px; top: 1262px; width: 936px; height: 220px; border-radius: 24px; background: linear-gradient(180deg, color-mix(in srgb, var(--acento, #DFAA7B) 12%, transparent), transparent); -webkit-mask-image: linear-gradient(180deg, #000, transparent); mask-image: linear-gradient(180deg, #000, transparent); transform: scaleY(-1); transform-origin: 50% 0; opacity: .6; }
  </style>

  <div id="pl-ldk" data-composition-id="L-dark-keynote" data-start="0" data-duration="4" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"kicker","type":"string","label":"Rótulo","default":"Presentamos","maxLength":24},
      {"id":"titulo","type":"string","label":"Título","default":"Espacio para pensar","maxLength":24},
      {"id":"subtitulo","type":"string","label":"Subtítulo","default":"Una interfaz, una idea","maxLength":30},
      {"id":"etiqueta","type":"string","label":"Etiqueta de la ficha elegida","default":"Esta ficha","maxLength":16}
    ]'>
    <div id="pl-ldk-fondo"></div><div id="pl-ldk-reticula"></div><div id="pl-ldk-reflejo"></div>
    <div id="pl-ldk-kicker" data-var-text="kicker">Presentamos</div>
    <div id="pl-ldk-titulo" data-var-text="titulo">Espacio para pensar</div>
    <div id="pl-ldk-sub" data-var-text="subtitulo">Una interfaz, una idea</div>
    <div id="pl-ldk-ventana">
      <div id="pl-ldk-barra"><i class="pl-ldk-punto" style="left:26px"></i><i class="pl-ldk-punto" style="left:56px"></i><i class="pl-ldk-punto" style="left:86px"></i><div id="pl-ldk-barra-linea"></div></div>
      <div id="pl-ldk-lateral"></div>
      <div id="pl-ldk-foco"></div>
      <svg id="pl-ldk-cursor" viewBox="0 0 56 64"><path d="M6 4 L6 52 L19 40 L28 60 L38 55 L29 36 L48 36 Z" fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/></svg>
    </div>
    <div id="pl-ldk-chip" data-var-text="etiqueta">Esta ficha</div>
  </div>

  <script>
    (function () {
      var vent = document.getElementById("pl-ldk-ventana"), lat = document.getElementById("pl-ldk-lateral");
      // Lateral: filas de menú y una selección que salta de fila en fila, siempre sobre la retícula
      var FILAS = [96, 150, 204, 258, 312];
      FILAS.forEach(function (y, i) { var it = document.createElement("div"); it.className = "pl-ldk-item"; it.style.top = (y - 60 + 12) + "px"; it.style.width = (96 + (i * 17) % 36) + "px"; lat.appendChild(it); });
      var sel = document.createElement("div"); sel.id = "pl-ldk-sel"; sel.style.top = (FILAS[0] - 60 + 0) + "px"; lat.insertBefore(sel, lat.firstChild);
      // Fichas 4 × 3, con un símbolo geométrico y dos renglones
      var COLS = 4, FIL = 3, X0 = 210, Y0 = 92, DX = 184, DY = 156, fichas = [];
      var colores = ["var(--acento, #DFAA7B)", "var(--segundo, #9EC0E4)", "color-mix(in srgb, var(--tinta, #A7A6A8) 60%, transparent)"];
      for (var r = 0; r < FIL; r++) for (var c = 0; c < COLS; c++) {
        var f = document.createElement("div"); f.className = "pl-ldk-ficha"; f.id = "pl-ldk-f-" + r + "-" + c; f.style.left = (X0 + c * DX) + "px"; f.style.top = (Y0 + r * DY) + "px";
        var g = document.createElement("div"); g.className = "pl-ldk-glifo"; g.style.background = colores[(r + c) % 3]; g.style.opacity = "0.85";
        g.style.borderRadius = ((r + c) % 3 === 0 ? "50%" : (r + c) % 3 === 1 ? "14px" : "14px 14px 14px 50%");
        var l1 = document.createElement("div"); l1.className = "pl-ldk-linea"; l1.style.top = "92px"; l1.style.width = (70 + ((r * 4 + c) * 23) % 60) + "px";
        var l2 = document.createElement("div"); l2.className = "pl-ldk-linea"; l2.style.top = "112px"; l2.style.width = "50px"; l2.style.opacity = "0.6";
        f.appendChild(g); f.appendChild(l1); f.appendChild(l2); vent.appendChild(f); fichas.push({ el: f, r: r, c: c });
      }
      var foco = document.getElementById("pl-ldk-foco"), cursor = document.getElementById("pl-ldk-cursor"), chip = document.getElementById("pl-ldk-chip");
      var OBJ = { r: 1, c: 2 };                                                  // ficha elegida
      var ox = X0 + OBJ.c * DX, oy = Y0 + OBJ.r * DY;
      foco.style.left = (ox - 6) + "px"; foco.style.top = (oy - 6) + "px";
      chip.style.top = (690 + oy - 22) + "px";
      // La etiqueta nace junto a la ficha y se desplaza a la izquierda si no cabe antes del borde (margen 72 px)
      function colocarChip() {
        var m = document.createElement("canvas").getContext("2d");
        m.font = "700 44px " + (getComputedStyle(chip).fontFamily || "Sora");
        var w = m.measureText(chip.textContent).width + 52;
        chip.style.left = Math.min(72 + ox + 120, 1008 - w) + "px";
      }
      colocarChip(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(colocarChip);
      gsap.set(cursor, { x: 780, y: 470 });

      var B = 0.5;                                                               // un pulso = 0,5 s (120 bpm); cada movimiento sale un pulso antes
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#pl-ldk-reticula", { opacity: 0.3 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
      tl.fromTo("#pl-ldk-kicker", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0);
      tl.fromTo("#pl-ldk-titulo", { opacity: 0, y: 36, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo("#pl-ldk-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.3);
      tl.fromTo("#pl-ldk-ventana", { y: 90, opacity: 0.35, scale: 0.97 }, { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.3)" }, B * 0.5);
      tl.fromTo("#pl-ldk-reflejo", { opacity: 0 }, { opacity: 0.6, duration: 0.6 }, B * 0.8);
      // Las fichas se encienden en diagonal, una por paso de retícula
      fichas.forEach(function (f) { tl.fromTo(f.el, { opacity: 0.12, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0.5 + (f.r + f.c) * 0.06); });
      // El menú lateral salta dos filas (en seco, sobre la retícula)
      tl.to("#pl-ldk-sel", { y: (FILAS[2] - FILAS[0]), duration: 0.25, ease: "power3.out" }, 1.0);
      // El cursor llega a la ficha elegida, ésta se enciende y sale la etiqueta con un sobreimpulso corto
      tl.to("#pl-ldk-cursor", { x: ox + 84, y: oy + 70, duration: 0.6, ease: "power3.inOut" }, 1.05);
      tl.fromTo("#pl-ldk-foco", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 1.6);
      tl.fromTo("#pl-ldk-chip", { opacity: 0, scale: 0.7, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.3)" }, 1.7);
      window.__timelines = window.__timelines || {};
      window.__timelines["L-dark-keynote"] = tl;
    })();
  </script>
</template>
