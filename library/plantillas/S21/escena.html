<template>
  <style>
    #pl-s21 { position: absolute; inset: 0; overflow: hidden; background: var(--fondo, #F5F2EB); color: var(--tinta, #111111); font-family: var(--cuerpo, "Source Sans 3"), sans-serif; }
    /* Retícula clara: cuatro columnas y una regla de base, el mundo llena los 1920 px. */
    #pl-s21-reticula { position: absolute; inset: 0; background-image: linear-gradient(90deg, rgba(17,17,17,0.07) 2px, transparent 2px); background-size: 234px 100%; background-position: 109px 0; }
    #pl-s21-marco { position: absolute; left: 72px; right: 72px; top: 150px; bottom: 150px; border-top: 3px solid var(--tinta, #111111); border-bottom: 3px solid var(--tinta, #111111); opacity: 0.9; }
    #pl-s21-pagina { position: absolute; left: 110px; width: 860px; top: 292px; }
    #pl-s21-etiqueta { font-family: var(--datos, "JetBrains Mono"), monospace; font-weight: 600; font-size: 44px; letter-spacing: 0.14em; text-transform: uppercase; line-height: 1.2; }
    #pl-s21-regla { height: 4px; margin: 22px 0 36px; background: var(--tinta, #111111); transform-origin: 0 50%; }
    #pl-s21-mascara { overflow: hidden; padding-bottom: 14px; margin-bottom: 20px; }
    #pl-s21-titulo { display: block; font-family: var(--display, "Fraunces"), serif; font-weight: 600; font-size: 150px; line-height: 1.02; letter-spacing: -0.02em; }
    .pl-s21-linea { font-family: var(--datos, "JetBrains Mono"), monospace; font-weight: 500; font-size: 48px; line-height: 1.45; color: var(--tinta, #111111); white-space: nowrap; }
    #pl-s21-acento { width: 170px; height: 16px; margin: 56px 0 40px; background: var(--acento, #D62828); transform-origin: 0 50%; }
    #pl-s21-dato { font-family: var(--cuerpo, "Source Sans 3"), sans-serif; font-weight: 700; font-size: 60px; line-height: 1.15; color: var(--tinta, #111111); }
    #pl-s21-folio { position: absolute; left: 110px; bottom: 214px; font-family: var(--datos, "JetBrains Mono"), monospace; font-size: 44px; font-weight: 500; color: var(--segundo, #6B6B6B); }
  </style>
  <div id="pl-s21" data-composition-id="S21" data-start="0" data-duration="4" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"etiqueta","type":"string","label":"Etiqueta","default":"Cuaderno"},{"id":"titulo","type":"string","label":"Título","default":"Menos, pero mejor"},{"id":"linea1","type":"string","label":"Línea 1","default":"Una idea por plano."},{"id":"linea2","type":"string","label":"Línea 2","default":"Un solo acento."},{"id":"linea3","type":"string","label":"Línea 3","default":"Mucho aire."},{"id":"dato","type":"string","label":"Dato final","default":"Orden, ritmo y silencio"}]'>
    <div id="pl-s21-reticula" data-layout-ignore></div>
    <div id="pl-s21-marco" data-layout-ignore></div>
    <div id="pl-s21-pagina">
      <div id="pl-s21-etiqueta" data-var-text="etiqueta">Cuaderno</div>
      <div id="pl-s21-regla"></div>
      <div id="pl-s21-mascara" data-layout-allow-overflow><span id="pl-s21-titulo" data-layout-allow-overflow data-var-text="titulo">Menos, pero mejor</span></div>
      <div id="pl-s21-l1" class="pl-s21-linea" data-var-text="linea1">Una idea por plano.</div>
      <div id="pl-s21-l2" class="pl-s21-linea" data-var-text="linea2">Un solo acento.</div>
      <div id="pl-s21-l3" class="pl-s21-linea" data-var-text="linea3">Mucho aire.</div>
      <div id="pl-s21-acento"></div>
      <div id="pl-s21-dato" data-var-text="dato">Orden, ritmo y silencio</div>
    </div>
    <div id="pl-s21-folio" data-layout-ignore>01 / 01</div>
  </div>
  <script>
    (function () {
      // El título se acomoda a su largo: corto, grande; largo, más pequeño, sin partir palabras.
      const titulo = document.getElementById("pl-s21-titulo");
      let ultimo = null;
      function ajustar() {
        const t = (titulo.textContent || "").trim();
        if (t === ultimo) return;
        ultimo = t;
        titulo.style.fontSize = (t.length <= 12 ? 176 : t.length <= 18 ? 150 : 128) + "px";
      }
      ajustar();
      const tl = gsap.timeline({ paused: true });
      tl.fromTo({ v: 0 }, { v: 0 }, { v: 1, duration: 4, ease: "none", onUpdate: ajustar }, 0);
      // Regla y etiqueta primero; el título sube por máscara en 0,6 s con 16 px de recorrido (S21).
      tl.fromTo("#pl-s21-regla", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#pl-s21-etiqueta", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power3.out" }, 0);
      tl.fromTo("#pl-s21-titulo", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 0.15);
      // Las líneas se escriben a máquina, una tras otra, con pasos fijos.
      ["#pl-s21-l1", "#pl-s21-l2", "#pl-s21-l3"].forEach((sel, i) => {
        tl.fromTo(sel, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "steps(26)" }, 0.8 + i * 0.5);
      });
      // Un solo acento gráfico y el dato; todo queda quieto desde 2,9 s.
      tl.fromTo("#pl-s21-acento", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 2.4);
      tl.fromTo("#pl-s21-dato", { opacity: 0, filter: "blur(6px)", y: 16 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.4, ease: "power3.out" }, 2.6);
      tl.fromTo("#pl-s21-folio", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.9);
      tl.to({}, { duration: 4 }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["S21"] = tl;
    })();
  </script>
</template>
