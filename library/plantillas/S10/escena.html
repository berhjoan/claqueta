        A: ".###./#...#/#...#/#####/#...#/#...#/#...#", B: "####./#...#/#...#/####./#...#/#...#/####.", C: ".####/#..../#..../#..../#..../#..../.####",

        J: "..###/...#./...#./...#./...#./#..#./.##..", K: "#...#/#..#./#.#../##.../#.#../#..#./#...#", L: "#..../#..../#..../#..../#..../#..../#####",

        Y: "#...#/#...#/.#.#./..#../..#../..#../..#..", Z: "#####/....#/...#./..#../.#.../#..../#####",

        "+": "...../..#../..#../#####/..#../..#../.....", "/": "....#/....#/...#./..#../.#.../#..../#....", " ": "...../...../...../...../...../...../.....",

      const ACENTO = { "Á": ["A", "...#."], "É": ["E", "...#."], "Í": ["I", "...#."], "Ó": ["O", "...#."], "Ú": ["U", "...#."], "Ü": ["U", ".#.#."], "Ñ": ["N", ".##.#"] };

          const g = (G[base] || G[" "]).split("/");
          filas[0] += marca + ".";
          for (let r = 0; r < 7; r++) filas[r + 1] += g[r] + ".";
        }
        return filas.map((f) => f.replace(/\.$/, "").replace(/\./g, " "));
      }
      // Lluvia de caracteres al fondo: llena los 1920 px y se queda quieta al terminar.
      const azar = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const rnd = azar(1004), glifos = "01#%@&+=<>/*", lluvia = raiz.querySelector("#pl-s10-lluvia");

      let ultimo = null;

        const t = (fuente.textContent || "").trim();
