<template>
  <style>
    #pl-glitch { position: absolute; inset: 0; pointer-events: none; }
    .pl-glitch-banda { position: absolute; left: -80px; top: 0; width: 1240px; height: 20px; mix-blend-mode: difference; opacity: 0; }
    .pl-glitch-fuente { display: none; }
  </style>
  <div id="pl-glitch" data-composition-id="transicion-glitch" data-start="0" data-duration="4" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"semilla","type":"string","label":"Semilla del glitch (cada número da uno distinto)","default":"7"},{"id":"cuadros","type":"string","label":"Cuadros que dura, a 30 por segundo","default":"6"}]'>
    <span id="pl-glitch-v-semilla" class="pl-glitch-fuente" data-var-text="semilla">7</span>
    <span id="pl-glitch-v-cuadros" class="pl-glitch-fuente" data-var-text="cuadros">6</span>
    <div id="pl-glitch-b0" class="pl-glitch-banda" data-layout-ignore></div><div id="pl-glitch-b1" class="pl-glitch-banda" data-layout-ignore></div><div id="pl-glitch-b2" class="pl-glitch-banda" data-layout-ignore></div><div id="pl-glitch-b3" class="pl-glitch-banda" data-layout-ignore></div>
    <div id="pl-glitch-b4" class="pl-glitch-banda" data-layout-ignore></div><div id="pl-glitch-b5" class="pl-glitch-banda" data-layout-ignore></div><div id="pl-glitch-b6" class="pl-glitch-banda" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      const raiz = document.getElementById("pl-glitch");
      const dato = (id) => (raiz.querySelector("#pl-glitch-v-" + id).textContent || "").trim();
      // Semilla fija: la misma cifra da siempre el mismo glitch, en preview y en render.
      const texto = dato("semilla") || "7";
      let h = 2166136261;
      for (const ch of texto) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
      const azar = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const rnd = azar(h >>> 0);
      const n = Math.max(2, Math.min(12, Math.round(Number(dato("cuadros")) || 6)));
      const alturas = [8, 14, 24, 40, 70, 120], colores = ["#ff0055", "#00f0ff", "#ffffff"];
      const tl = gsap.timeline({ paused: true });
      // Bandas que invierten lo que hay debajo (mix-blend-mode: difference): ruido corto, sin barridos ni cortes propios.
      for (let k = 0; k < n; k++) {
        const t = k / 30;
        for (let j = 0; j < 7; j++) {
          const apagada = k === n - 1 && j > 1;
          tl.set("#pl-glitch-b" + j, {
            y: Math.round(150 + rnd() * 1550), height: alturas[Math.floor(rnd() * alturas.length)], x: Math.round((rnd() - 0.5) * 120),
            backgroundColor: colores[Math.floor(rnd() * colores.length)], opacity: apagada ? 0 : +(0.55 + rnd() * 0.4).toFixed(2),
          }, t);
        }
      }
      tl.set(".pl-glitch-banda", { opacity: 0 }, n / 30);
      tl.to({}, { duration: 4 }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["transicion-glitch"] = tl;
    })();
  </script>
</template>
