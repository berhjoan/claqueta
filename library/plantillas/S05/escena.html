<template>
  <style>

    #pl-s05 { position: absolute; inset: 0; overflow: hidden; background: var(--fondo, #050A12); color: var(--tinta, #E6F1FF); font-family: var(--display, "Sora"), sans-serif; }
    #pl-s05-cielo { position: absolute; inset: 0; background:
      radial-gradient(60% 34% at 50% 31%, color-mix(in srgb, var(--segundo, #7A5CFF) 26%, transparent) 0%, transparent 72%),
      linear-gradient(180deg, color-mix(in srgb, var(--superficie, #0D1726) 70%, var(--fondo, #050A12)) 0%, var(--fondo, #050A12) 47%, var(--fondo, #050A12) 100%); }
    #pl-s05-lienzo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #pl-s05-kicker { position: absolute; left: 72px; right: 72px; top: 262px; font-family: var(--datos, "JetBrains Mono"), monospace; font-weight: 700; font-size: 46px; letter-spacing: .12em; text-transform: uppercase; color: var(--acento, #00E5FF); white-space: nowrap; overflow: hidden; }
    #pl-s05-panel { position: absolute; left: 72px; right: 72px; top: 1000px; height: 250px; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; background: color-mix(in srgb, var(--superficie, #0D1726) 82%, transparent); border: 3px solid color-mix(in srgb, var(--acento, #00E5FF) 70%, transparent); border-radius: 6px; box-shadow: 0 0 40px color-mix(in srgb, var(--acento, #00E5FF) 18%, transparent); }
    #pl-s05-titulo { font-weight: 800; font-size: 88px; line-height: 1.04; letter-spacing: -.02em; white-space: nowrap; }
    #pl-s05-sub { margin-top: 10px; font-family: var(--datos, "JetBrains Mono"), monospace; font-weight: 600; font-size: 44px; color: var(--segundo, #7A5CFF); filter: brightness(1.5); white-space: nowrap; overflow: hidden; }
  </style>

  <div id="pl-s05" data-composition-id="S05" data-start="0" data-duration="4" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"kicker","type":"string","label":"Rótulo","default":"malla / nudo 2,3","maxLength":24},
      {"id":"titulo","type":"string","label":"Título","default":"Estructura","maxLength":10},
      {"id":"subtitulo","type":"string","label":"Subtítulo","default":"vértices y aristas","maxLength":26}
    ]'>
    <div id="pl-s05-cielo"></div>
    <canvas id="pl-s05-lienzo" width="1080" height="1920" data-layout-allow-overflow></canvas>
    <div id="pl-s05-kicker" data-var-text="kicker">malla / nudo 2,3</div>
    <div id="pl-s05-panel"><div id="pl-s05-titulo" data-var-text="titulo">Estructura</div><div id="pl-s05-sub" data-var-text="subtitulo">vértices y aristas</div></div>
  </div>

  <script>
    (function () {
      var W = 1080, H = 1920, CX = 540, CY = 600, HOR = 905;
      var root = document.getElementById("pl-s05"), cv = document.getElementById("pl-s05-lienzo"), ctx = cv.getContext("2d");
      function cor(css) { var s = document.createElement("span"); s.style.color = css; root.appendChild(s); var c = getComputedStyle(s).color; root.removeChild(s); return c; }
      function rgb(c) { var m = c.match(/[\d.]+/g); return [+m[0], +m[1], +m[2]]; }
      var VIO = rgb(cor("var(--segundo, #7A5CFF)")), CIAN = rgb(cor("var(--acento, #00E5FF)")), BLANCO = rgb(cor("var(--tinta, #E6F1FF)"));
      function mezcla(a, b, t) { return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * t) + "," + Math.round(a[1] + (b[1] - a[1]) * t) + "," + Math.round(a[2] + (b[2] - a[2]) * t) + ")"; }

      // Nudo (2,3) sobre un toro; el tubo se arma con la normal del toro, así el marco es suave y cerrado
      var U = 240, V = 12, S = 128, TUBO = 36, P = 2, Q = 3;
      var K = [], N = [], Bn = [];
      for (var i = 0; i <= U; i++) {
        var u = i / U * 6.2832, cu = Math.cos(P * u), su = Math.sin(P * u), cq = Math.cos(Q * u), sq = Math.sin(Q * u);
        var r = cq + 2, x = r * cu, y = r * su, z = -sq;
        var eps = 1e-3, u2 = u + eps, r2 = Math.cos(Q * u2) + 2, x2 = r2 * Math.cos(P * u2), y2 = r2 * Math.sin(P * u2), z2 = -Math.sin(Q * u2);
        var tx = x2 - x, ty = y2 - y, tz = z2 - z, tl = Math.hypot(tx, ty, tz); tx /= tl; ty /= tl; tz /= tl;
        var nx = cq * cu, ny = cq * su, nz = -sq, nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
        var bx = ty * nz - tz * ny, by = tz * nx - tx * nz, bz = tx * ny - ty * nx;
        K.push([x * S, y * S, z * S]); N.push([nx, ny, nz]); Bn.push([bx, by, bz]);
      }
      function punto(i, v) { var c = Math.cos(v) * TUBO, s = Math.sin(v) * TUBO, k = K[i], n = N[i], b = Bn[i]; return [k[0] + n[0] * c + b[0] * s, k[1] + n[1] * c + b[1] * s, k[2] + n[2] * c + b[2] * s]; }

      var CAM = 1800;
      function proyectar(p, a, tilt) {
        var ca = Math.cos(a), sa = Math.sin(a), ct = Math.cos(tilt), st = Math.sin(tilt);
        var x1 = p[0] * ca + p[2] * sa, z1 = -p[0] * sa + p[2] * ca, y1 = p[1];
        var y2 = y1 * ct - z1 * st, z2 = y1 * st + z1 * ct, k = CAM / (CAM + z2);
        return [CX + x1 * k, CY + y2 * k, z2];
      }

      function suelo(t) {
        // Cuadrícula en perspectiva hasta el borde inferior: es el mundo del estilo y llena los 1920 px
        var a = Math.min(1, t / 0.7);
        ctx.lineWidth = 2;
        var VP = [CX, HOR - 60];
        for (var k = -16; k <= 16; k++) {
          var xb = CX + k * 190, g = 1 - Math.abs(k) / 18;
          var gr = ctx.createLinearGradient(0, HOR, 0, H);
          gr.addColorStop(0, "rgba(" + CIAN[0] + "," + CIAN[1] + "," + CIAN[2] + ",0)"); gr.addColorStop(0.4, "rgba(" + CIAN[0] + "," + CIAN[1] + "," + CIAN[2] + "," + (0.5 * g * a) + ")"); gr.addColorStop(1, "rgba(" + CIAN[0] + "," + CIAN[1] + "," + CIAN[2] + "," + (0.3 * g * a) + ")");
          ctx.strokeStyle = gr; ctx.beginPath(); ctx.moveTo(VP[0] + (xb - VP[0]) * 0.02, HOR); ctx.lineTo(xb, H); ctx.stroke();
        }
        for (var j = 1; j <= 15; j++) {
          var f = j / 15, y = HOR + Math.pow(f, 1.9) * (H - HOR);
          ctx.strokeStyle = "rgba(" + CIAN[0] + "," + CIAN[1] + "," + CIAN[2] + "," + (0.12 + 0.4 * f) * a + ")";
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }
        ctx.strokeStyle = "rgba(" + CIAN[0] + "," + CIAN[1] + "," + CIAN[2] + "," + (0.85 * a) + ")"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, HOR); ctx.lineTo(W, HOR); ctx.stroke();
      }

      function pintar(t) {
        ctx.clearRect(0, 0, W, H);
        suelo(t);
        var k = Math.min(1, t / 3.0), e = 1 - Math.pow(1 - k, 3);
        var ang = 1.9 - 1.55 * e, tilt = 0.55 - 0.2 * e;                   // gira ~89° frenando hasta quedar casi de frente, quieto desde 3,0 s
        var rev = 0.16 + 0.84 * (1 - Math.pow(1 - Math.min(1, t / 1.6), 3));  // el hilo se dibuja a lo largo del nudo
        var iMax = Math.floor(U * rev);
        var cub = [[], [], [], [], [], []];                                 // segmentos por profundidad, de lejos a cerca
        var zmin = 1e9, zmax = -1e9, pr = [];
        for (var v = 0; v < V; v++) {
          var fila = []; var vv = v / V * 6.2832;
          for (var i = 0; i <= iMax; i++) { var q = proyectar(punto(i, vv), ang, tilt); fila.push(q); if (q[2] < zmin) zmin = q[2]; if (q[2] > zmax) zmax = q[2]; }
          pr.push(fila);
        }
        function cubo(z) { var b = Math.floor((1 - (z - zmin) / (zmax - zmin + 1e-6)) * 5.999); return b < 0 ? 0 : b > 5 ? 5 : b; }
        for (var v2 = 0; v2 < V; v2++) for (var i2 = 1; i2 <= iMax; i2++) { var a = pr[v2][i2 - 1], b = pr[v2][i2]; cub[cubo((a[2] + b[2]) / 2)].push(a[0], a[1], b[0], b[1]); }
        for (var i3 = 0; i3 <= iMax; i3 += 5) for (var v3 = 0; v3 < V; v3++) { var a2 = pr[v3][i3], b2 = pr[(v3 + 1) % V][i3]; cub[cubo((a2[2] + b2[2]) / 2)].push(a2[0], a2[1], b2[0], b2[1]); }
        ctx.lineCap = "round";
        for (var c = 0; c < 6; c++) {
          var f = c / 5, seg = cub[c];
          ctx.strokeStyle = mezcla(VIO, c >= 4 ? CIAN : BLANCO, c >= 4 ? (f - 0.7) * 2 : 0.18 * f);
          ctx.globalAlpha = 0.22 + 0.78 * f; ctx.lineWidth = 1.4 + 1.3 * f;
          ctx.beginPath(); for (var s = 0; s < seg.length; s += 4) { ctx.moveTo(seg[s], seg[s + 1]); ctx.lineTo(seg[s + 2], seg[s + 3]); } ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      var reloj = 0, rel = {};
      Object.defineProperty(rel, "t", { configurable: true, get: function () { return reloj; }, set: function (x) { reloj = x; pintar(x); } });
      var tl = gsap.timeline({ paused: true });
      tl.to(rel, { t: 4, duration: 4, ease: "none" }, 0);
      tl.fromTo("#pl-s05-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo("#pl-s05-panel", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.7);
      pintar(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["S05"] = tl;
    })();
  </script>
</template>
