  <script>
    (function () {
      var DEG = Math.PI / 180;
      var vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};

      var lineas = [v("l1", "TU TÍTULO"), v("l2", "VA AQUÍ"), v("l3", "EN CADA"), v("l4", "LÁMINA")]
        .map(function (s) { return String(s).toUpperCase().slice(0, COLS); });

      // Tambor: se recorre en orden, como en un panel real. Los caracteres que no estén se añaden al final.
      var alfabeto = " ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑ0123456789.,¿?¡!:-";
      lineas.forEach(function (s) { for (var i = 0; i < s.length; i++) if (alfabeto.indexOf(s[i]) < 0) alfabeto += s[i]; });
      var N = alfabeto.length;

      // Destino de cada casilla, con la línea centrada
      var celdas = [], maxPasos = 0, inicioMax = 0;
      var filas = document.querySelector("#pl-s13-tablero");
      var ultima = -1;
      lineas.forEach(function (s, r) { if (s.trim().length) ultima = r; });
      for (var r = 0; r < ROWS; r++) {
        var fila = document.createElement("div");
        fila.className = "pl-s13-fila" + (r === ultima ? " pl-s13-ultima" : "");
        var s = lineas[r], lead = Math.floor((COLS - s.length) / 2);
        for (var c = 0; c < COLS; c++) {
          var ch = (c >= lead && c < lead + s.length) ? s.charAt(c - lead) : " ";
          var pasos = Math.max(0, alfabeto.indexOf(ch));
          var inicio = 0.2 + c * 0.045 + r * 0.12;
          maxPasos = Math.max(maxPasos, pasos); inicioMax = Math.max(inicioMax, inicio);
          var celda = document.createElement("div");
          celda.className = "pl-s13-celda"; celda.id = "pl-s13-c-" + r + "-" + c;
          celda.style.width = CW + "px"; celda.style.height = CH + "px";
          // El mecanismo son hojas apiladas y giratorias: el auditor de capas no puede leerlas, así que no las audita.
          celda.setAttribute("data-layout-ignore", "");
          function cara(cls, top) {
            var f = document.createElement("div"); f.className = "pl-s13-cara " + cls;
            var g = document.createElement("span"); g.className = "pl-s13-glifo";
            g.style.height = CH + "px"; g.style.lineHeight = CH + "px"; g.style.fontSize = Math.round(CW * 0.8) + "px"; g.style.top = top + "px";
            f.appendChild(g); return f;
          }
          var sup = cara("pl-s13-sup", 0), inf = cara("pl-s13-inf", -Math.round(CH / 2)), ha = cara("pl-s13-hoja-a", 0), hb = cara("pl-s13-hoja-b", -Math.round(CH / 2));
          var costura = document.createElement("div"); costura.className = "pl-s13-costura";
          celda.appendChild(sup); celda.appendChild(inf); celda.appendChild(ha); celda.appendChild(hb); celda.appendChild(costura);
          fila.appendChild(celda);
          celdas.push({ pasos: pasos, inicio: inicio, sup: sup.firstChild, inf: inf.firstChild, ha: ha, hb: hb, ga: ha.firstChild, gb: hb.firstChild });
        }
        filas.appendChild(fila);
      }
      // Cada casilla gira como máximo hasta 3,05 s; el panel queda quieto y legible hasta el final.
      var FIN = 3.05;
      var flip = Math.max(0.03, Math.min(0.075, (FIN - inicioMax) / Math.max(1, maxPasos)));

      function limpiar(hoja, glifo) { hoja.style.opacity = "0"; hoja.style.transform = ""; hoja.style.filter = ""; glifo.textContent = ""; }
      function mostrar(hoja, glifo, ch, ang, sombra) { glifo.textContent = ch; hoja.style.opacity = "1"; hoja.style.transform = "rotateX(" + ang.toFixed(2) + "deg)"; hoja.style.filter = "brightness(" + sombra + ")"; }

      function pintar(t) {
        for (var i = 0; i < celdas.length; i++) {
          var c = celdas[i];
          var tl = t - c.inicio;
          var raw = tl <= 0 ? 0 : tl / flip;
          var cuenta = Math.floor(raw), p = raw - cuenta;
          if (cuenta >= c.pasos) { cuenta = c.pasos; p = 0; }
          var sale = alfabeto.charAt(cuenta % N), entra = alfabeto.charAt((cuenta + 1) % N);
          var girando = cuenta < c.pasos && p > 0;
          if (!girando) { c.sup.textContent = sale; c.inf.textContent = sale; limpiar(c.ha, c.ga); limpiar(c.hb, c.gb); continue; }
          c.sup.textContent = entra; c.inf.textContent = sale;
          var th = 180 * p * p, sombra = (1 - 0.5 * Math.sin(th * DEG)).toFixed(3);
          if (th < 90) { mostrar(c.ha, c.ga, sale, -th, sombra); limpiar(c.hb, c.gb); }
          else { limpiar(c.ha, c.ga); mostrar(c.hb, c.gb, entra, 180 - th, sombra); }
        }
      }
      var reloj = 0, rel = {};
      Object.defineProperty(rel, "t", { configurable: true, get: function () { return reloj; }, set: function (x) { reloj = x; pintar(x); } });

      var tl = gsap.timeline({ paused: true });
      tl.to(rel, { t: 4, duration: 4, ease: "none" }, 0);
      tl.fromTo("#pl-s13-kick", { y: -26 }, { y: 0, duration: 0.45, ease: "power3.out" }, 0);

    })();
