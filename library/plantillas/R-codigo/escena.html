          var ultimo = i === datos.length - 1 && u >= total - 0.001;
          if (enCurso || ultimo) { html += '<span class="pl-rco-cursor"></span>'; cursorEn = i; }
          els[i].tx.innerHTML = html;
          els[i].fila.style.opacity = (d.signo && u < acu - coste[i] + 1) ? "0.0" : "1";
        });
