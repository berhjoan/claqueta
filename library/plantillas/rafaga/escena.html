  <script>
    (function () {
      const raiz = document.getElementById("pl-rafaga");
      const CAT = JSON.parse(raiz.querySelector("#pl-rafaga-catalogo").textContent); // id → [nombre, familia]
      const dato = (id) => (raiz.querySelector("#pl-rafaga-v-" + id).textContent || "").trim();
      const ids = (txt) => txt.split(/[\s,;]+/).filter(Boolean);
      const num = (txt, def) => { const n = Number(String(txt).replace(",", ".")); return Number.isFinite(n) && n > 0 ? n : def; };
      let lista = ids(dato("lista")).filter((id) => CAT[id]);
      if (!lista.length) lista = Object.keys(CAT).slice(0, 8);
      const paradas = new Set(ids(dato("paradas")));
      const cuadros = Math.max(1, Math.round(num(dato("cadencia"), 2)));
      const pausa = num(dato("pausa"), 0.5);
      const carpeta = (dato("carpeta") || "assets/thumbs").replace(/\/+$/, "");
      const modo = dato("mosaico").toLowerCase();
      const mosaico = modo === "no" ? [] : modo === "todo" || modo === "" ? Object.keys(CAT) : ids(dato("mosaico")).filter((id) => CAT[id]);
      const ruta = (id) => carpeta + "/" + id + ".webp";
      const nuevo = (tag, clase, id) => { const e = document.createElement(tag); if (clase) e.className = clase; if (id) e.id = id; return e; };

      // A. Mosaico: 8 columnas de 135 px, centrado en vertical; entra en ola diagonal.
      const COLS = 8, W = 135, H = 165, filas = Math.ceil(mosaico.length / COLS), y0 = Math.round((1920 - filas * H) / 2);
      const cont = raiz.querySelector("#pl-rafaga-mosaico");
      const sombra = raiz.querySelector("#pl-rafaga-sombra");
      mosaico.forEach((id, i) => {
        const im = nuevo("img", "pl-rafaga-m");
        const c = i % COLS, f = Math.floor(i / COLS);
        im.src = ruta(id); im.alt = ""; im.style.left = c * W + "px"; im.style.top = y0 + f * H + "px";
        im.dataset.d = ((c + f) * 0.025).toFixed(3);
        cont.insertBefore(im, sombra);
      });
      const mosaicoSeg = mosaico.length ? 1.3 : 0;

      // B. Baraja: una carta por miniatura, apiladas; solo una visible a la vez.
      const baraja = raiz.querySelector("#pl-rafaga-baraja");
      const cartas = lista.map((id, i) => {
        const c = nuevo("div", "pl-rafaga-carta", "pl-rafaga-c" + i);
        const im = nuevo("img"); im.src = ruta(id); im.alt = "";
        c.appendChild(im);
        if (paradas.has(id)) {
          const pos = nuevo("div", "pl-rafaga-pos"); pos.textContent = String(i + 1).padStart(2, "0") + " / " + String(lista.length).padStart(2, "0");
          c.appendChild(pos);
          const n = nuevo("div", "pl-rafaga-nombre"); n.textContent = CAT[id][0];
          c.appendChild(n);
          // La familia pide más tiempo que el nombre: en una parada corta no se alcanza a leer.
          if (pausa >= 1) { const d = nuevo("div", "pl-rafaga-id"); d.textContent = id + " · " + CAT[id][1]; c.appendChild(d); }
        }
        baraja.appendChild(c);
        return c;
      });

      const tl = gsap.timeline({ paused: true });
      if (mosaico.length) {
        cont.querySelectorAll(".pl-rafaga-m").forEach((m) => tl.fromTo(m, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, parseFloat(m.dataset.d)));
        tl.fromTo("#pl-rafaga-mosaico", { scale: 1, transformOrigin: "540px 960px" }, { scale: 1.06, duration: mosaicoSeg, ease: "power2.inOut" }, 0);
        // El contador aterriza en la cifra en 0,45 s.
        const n = { v: 0 }, cifra = raiz.querySelector("#pl-rafaga-num");
        tl.fromTo("#pl-rafaga-caja", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out" }, 0.3);
        tl.fromTo(n, { v: 0 }, { v: mosaico.length, duration: 0.45, ease: "power3.out", onUpdate: () => { cifra.textContent = String(Math.round(n.v)); } }, 0.3);
        tl.set(["#pl-rafaga-mosaico", "#pl-rafaga-caja"], { opacity: 0 }, mosaicoSeg);
      } else {
        tl.set("#pl-rafaga-caja", { opacity: 0 }, 0);
      }
      tl.set("#pl-rafaga-baraja", { opacity: 1 }, mosaicoSeg);
      // Cada carta dura «cuadros»/30 s; una parada dura «pausa» s. La última se queda.
      let t = mosaicoSeg;
      cartas.forEach((c, i) => {
        const dur = paradas.has(lista[i]) ? pausa : cuadros / 30;
        tl.set(c, { opacity: 1 }, t);
        tl.set("#pl-rafaga-barra", { scaleX: (i + 1) / cartas.length }, t);
        if (i < cartas.length - 1) tl.set(c, { opacity: 0 }, t + dur);
        t += dur;
      });
      tl.to({}, { duration: Math.max(4, t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["rafaga"] = tl;
    })();
  </script>
