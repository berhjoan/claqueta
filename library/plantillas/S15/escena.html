<template>
  <style>

    #pl-s15 { position: absolute; inset: 0; overflow: hidden; background: var(--fondo, #F2ECDC); color: var(--tinta, #1B2455); font-family: var(--cuerpo, "Archivo"), sans-serif; }
    #pl-s15-lienzo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #pl-s15-kicker { position: absolute; left: 72px; top: 262px; font-weight: 800; font-size: 46px; letter-spacing: .16em; text-transform: uppercase; color: var(--tinta, #1B2455); white-space: nowrap; }
    #pl-s15-bloque { position: absolute; left: 48px; right: 48px; top: 930px; display: flex; flex-direction: column; gap: 22px; padding: 30px 36px 34px; border-radius: 26px; background: var(--superficie, #E8E0CB); box-shadow: 0 0 0 4px var(--tinta, #1B2455); }
    #pl-s15-titulo { font-family: var(--display, "Archivo Black"), sans-serif; font-weight: 400; font-size: 92px; line-height: 1.02; letter-spacing: -.01em; color: var(--tinta, #1B2455); text-wrap: balance; }
    #pl-s15-sub { font-weight: 700; font-size: 48px; line-height: 1.15; color: color-mix(in srgb, var(--acento, #D9342B) 85%, #000); }
  </style>

  <div id="pl-s15" data-composition-id="S15" data-start="0" data-duration="4" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"kicker","type":"string","label":"Rótulo","default":"Impreso en dos tintas","maxLength":24},
      {"id":"titulo","type":"string","label":"Título","default":"Puntos con volumen","maxLength":22},
      {"id":"subtitulo","type":"string","label":"Subtítulo","default":"Rojo y azul sobre papel crema","maxLength":32}
    ]'>
    <canvas id="pl-s15-lienzo" width="1080" height="1920" data-layout-allow-overflow></canvas>
    <div id="pl-s15-kicker" data-var-text="kicker">Impreso en dos tintas</div>
    <div id="pl-s15-bloque"><div id="pl-s15-titulo" data-var-text="titulo">Puntos con volumen</div>
    <div id="pl-s15-sub" data-var-text="subtitulo">Rojo y azul sobre papel crema</div></div>
  </div>

  <script>
    (function () {
      var W = 1080, H = 1920, CELDA = 11;
      var cv = document.getElementById("pl-s15-lienzo"), ctx = cv.getContext("2d");
      var root = document.getElementById("pl-s15");
      // Resolver cada color de la paleta una sola vez, para que el lienzo use lo mismo que el CSS
      function cor(css) { var s = document.createElement("span"); s.style.color = css; root.appendChild(s); var c = getComputedStyle(s).color; root.removeChild(s); return c; }
      var FONDO = cor("var(--fondo, #F2ECDC)"), ROJO = cor("var(--acento, #D9342B)"), AZUL = cor("var(--segundo, #2B4FA8)");

      // Retículas fijas, una por tinta, con los ángulos clásicos de pantalla de imprenta (15° y 75°)
      function reticula(ang) {
        var a = ang * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), pts = [], n = Math.ceil(Math.hypot(W, H) / CELDA) + 2;
        for (var u = -n; u <= n; u++) for (var v = -n; v <= n; v++) {
          var x = W / 2 + (u * ca - v * sa) * CELDA, y = H / 2 + (u * sa + v * ca) * CELDA;
          if (x > -CELDA && x < W + CELDA && y > -CELDA && y < H + CELDA) pts.push(x, y);
        }
        return new Float32Array(pts);
      }
      var RET_R = reticula(15), RET_A = reticula(75);

      function sm(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
      var CX = 540, CY = 650, R = 285;               // esfera
      var ANILLO = 440, TUBO = 36;                    // aro: radio mayor y radio del tubo

      function estado(t) {
        var k = Math.min(1, t / 3.0), p = 1 - Math.pow(1 - k, 3);    // se frena y queda quieto desde 3,0 s
        return { luz: -0.9 + 2.2 * p, fi: 0.7 - 1.0 * p, tilt: 0.95 + 0.27 * p, reveal: 260 + 1700 * (1 - Math.pow(1 - Math.min(1, t / 1.5), 3)) };
      }

      function pintar(t) {
        var e = estado(t);
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = FONDO; ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = "multiply";
        // luz de la esfera
        var lx = Math.cos(e.luz) * 0.62, ly = -0.5, lz = Math.sqrt(Math.max(0.05, 1 - lx * lx - ly * ly));
        // aro: marco local girado fi, achatado por cos(tilt)
        var cf = Math.cos(e.fi), sf = Math.sin(e.fi), ct = Math.max(0.2, Math.abs(Math.cos(e.tilt)));

        // Tinta roja: la esfera. Sombra = punto grande, luz = punto pequeño.
        ctx.fillStyle = ROJO; ctx.beginPath();
        for (var i = 0; i < RET_R.length; i += 2) {
          var x = RET_R[i], y = RET_R[i + 1], dx = x - CX, dy = y - CY, d2 = dx * dx + dy * dy;
          var cob = 0;
          if (d2 < R * R) {
            var nx = dx / R, ny = dy / R, nz = Math.sqrt(1 - nx * nx - ny * ny);
            var lam = Math.max(0, nx * lx + ny * ly + nz * lz);
            cob = 1 - (0.1 + 0.9 * lam);
            cob = Math.max(0.04, cob) * sm(R, R - 9, Math.sqrt(d2) );
          }
          var rev = sm(0, 1, (e.reveal - Math.hypot(x - CX, y - CY)) / 240);
          cob *= rev;
          if (cob > 0.02) { var r = CELDA * 0.74 * Math.sqrt(cob); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832); }
        }
        ctx.fill();

        // Tinta azul: el aro, que pasa por detrás y por delante de la esfera, y un velo de puntos que crece hacia abajo.
        ctx.fillStyle = AZUL; ctx.beginPath();
        for (var j = 0; j < RET_A.length; j += 2) {
          var X = RET_A[j], Y = RET_A[j + 1], ox = X - CX, oy = Y - CY;
          var lxp = ox * cf + oy * sf, lyp = -ox * sf + oy * cf;                  // al marco del aro
          var th = Math.atan2(lyp / ct, lxp), ex = ANILLO * Math.cos(th), ey = ANILLO * ct * Math.sin(th);
          var dist = Math.hypot(lxp - ex, lyp - ey), delante = Math.sin(th) > 0;
          var dentro = ox * ox + oy * oy < R * R;
          var cb = 0;
          if (dist < TUBO && !(dentro && !delante)) {
            var q = dist / TUBO;
            cb = (0.55 + 0.45 * (1 - q * q)) * (delante ? 1 : 0.8) * sm(TUBO, TUBO - 6, dist);
          }
          // velo de fondo: puntos finos arriba, más grandes hacia el pie, casi nada bajo el texto
          var vel = 0.05 + 0.6 * Math.pow(Y / H, 2.2);
          vel *= 1 - 0.93 * sm(870, 950, Y) * (1 - sm(1250, 1340, Y)) - 0.7 * sm(240, 270, Y) * (1 - sm(330, 360, Y));
          if (!dentro) cb = Math.max(cb, vel);
          cb *= sm(0, 1, (e.reveal - Math.hypot(X - CX, Y - CY)) / 240);
          if (cb > 0.02) { var rr = CELDA * 0.74 * Math.sqrt(cb); ctx.moveTo(X + rr, Y); ctx.arc(X, Y, rr, 0, 6.2832); }
        }
        ctx.fill();
        ctx.globalCompositeOperation = "source-over";
      }

      var reloj = 0, rel = {};
      Object.defineProperty(rel, "t", { configurable: true, get: function () { return reloj; }, set: function (x) { reloj = x; pintar(x); } });
      var tl = gsap.timeline({ paused: true });
      tl.to(rel, { t: 4, duration: 4, ease: "none" }, 0);
      tl.fromTo("#pl-s15-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#pl-s15-titulo", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.55);
      tl.fromTo("#pl-s15-sub", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.9);
      pintar(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["S15"] = tl;
    })();
  </script>
</template>
