<template>
  <style>
      @font-face { font-family: "Sora"; src: url("assets/fonts/Sora-Variable.ttf") format("truetype"); font-weight: 100 800; font-display: block; }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      
      #root {
        pointer-events: none;
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #hl-video {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hl-overlay {
        position: absolute;
        inset: 0;
        background: transparent;
        z-index: 1;
        pointer-events: none;
      }
      #hl-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      .hl-group {
        position: absolute;
        top: 1300px; height: 240px; align-content: center;
        left: 0;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 72px;
        opacity: 0;
        visibility: hidden;
      }
      .hl-word {
        font-family: "Sora", sans-serif;
        font-weight: 800;
        font-size: 80px;
        text-transform: uppercase;
        color: #ffffff;
        display: inline-block;
        letter-spacing: 0.02em;
        line-height: 1;
        position: relative;
        padding: 6px 12px 8px;
        text-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        transform-origin: 50% 58%;
        will-change: transform, filter;
      }
      .hl-word-bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #ff1745 0%, #df1238 100%);
        border-radius: 10px;
        box-shadow: 0 12px 30px rgba(229, 20, 58, 0.32);
        opacity: 0;
        transform: scaleX(0);
        transform-origin: 0% 50%;
        z-index: -1;
      }
      .hl-word-text {
        position: relative;
        z-index: 1;
      }
    
  </style>
  <div id="root" data-composition-id="caption-highlight" data-width="1080" data-height="1920">
      <div class="hl-overlay"></div>
      <div id="hl-container"></div>
  </div>
  <script>
      // ---- Claqueta: palabras desde palabras.json ({palabra, inicio, fin}) o {text, start, end} ----
      // Pega el contenido de palabras.json en el index.html, en un script suelto: window.PALABRAS = [ ... ];
      // Sin eso se usa la frase de demostracion que trae cada archivo.
      window.__cq = window.__cq || {};
      window.__cq.palabras = function (demo) {
        var raw = window.PALABRAS && window.PALABRAS.length ? window.PALABRAS : demo;
        return raw
          .map(function (p) {
            var a = p.inicio != null ? p.inicio : p.start != null ? p.start : 0;
            var b = p.fin != null ? p.fin : p.end != null ? p.end : a;
            return { text: String(p.palabra || p.text || p.word || "").trim(), start: Number(a) || 0, end: Number(b) || 0 };
          })
          .filter(function (w) { return w.text.length > 0; });
      };
      window.__cq.duracion = function (def) {
        if (!(window.PALABRAS && window.PALABRAS.length)) return def;
        var m = 0;
        window.__cq.palabras([]).forEach(function (w) { m = Math.max(m, w.end); });
        return m + 0.7;
      };
      // Grupos de hasta maxPal palabras y maxCar letras; corta en puntuacion o en pausa >= 0.28 s.
      window.__cq.pares = function (words, maxPal, maxCar) {
        var out = [], ini = 0, car = 0;
        for (var i = 0; i < words.length; i++) {
          car += words[i].text.length + 1;
          var finFrase = /[.!?;:,]$/.test(words[i].text);
          var hueco = i + 1 < words.length ? words[i + 1].start - words[i].end : 0;
          var lleno = i - ini + 1 >= maxPal || (i + 1 < words.length && car + words[i + 1].text.length + 1 > maxCar);
          if (finFrase || hueco >= 0.28 || lleno || i === words.length - 1) { out.push([ini, i]); ini = i + 1; car = 0; }
        }
        return out;
      };
      window.__cq.grupos = function (words, maxPal, maxCar) {
        var p = window.__cq.pares(words, maxPal, maxCar);
        return p.map(function (par, gi) {
          var sig = gi + 1 < p.length ? words[p[gi + 1][0]].start : Infinity;
          return { wordStart: par[0], wordEnd: par[1], start: words[par[0]].start, end: Math.min(words[par[1]].end + 0.5, sig - 0.05) };
        });
      };
      // Palabras de enfasis: 8 letras o mas, o cierre de exclamacion/pregunta.
      window.__cq.claves = function (words) {
        var s = new Set();
        words.forEach(function (w, i) {
          var l = w.text.replace(/[^A-Za-zÀ-ſ0-9]/g, "").length;
          if (l >= 8 || /[!?]$/.test(w.text)) s.add(i);
        });
        return s;
      };
      window.__cq.listo = function (id, fuentes, fn) {
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady[id] = Promise.all(fuentes.map(function (f) { return document.fonts.load(f, "AaÁáÉéÍíÓóÚúÑñ¿¡?!"); })).then(fn);
      };
      window.__cq.listo("caption-highlight", ["800 72px Sora"], function () {
      (function () {
        window.__timelines = window.__timelines || {};

        var _fitCanvas = document.createElement("canvas");
        var _fitCtx = _fitCanvas.getContext("2d");
        function fitFontSize(text, baseFontSize, fontWeight, fontFamily, maxWidth) {
          var size = baseFontSize;
          var minSize = Math.max(44, Math.floor(baseFontSize * 0.45));
          while (size > minSize) {
            _fitCtx.font = fontWeight + " " + size + "px " + fontFamily;
            if (_fitCtx.measureText(text).width <= maxWidth) return size;
            size -= 2;
          }
          return minSize;
        }

        var WORDS = window.__cq.palabras([
          {"text": "¿Cuánto", "start": 0.3, "end": 0.6},
          {"text": "cuesta?", "start": 0.65, "end": 0.95},
          {"text": "¡Más", "start": 1.2, "end": 1.5},
          {"text": "de", "start": 1.55, "end": 1.85},
          {"text": "lo", "start": 1.9, "end": 2.2},
          {"text": "que", "start": 2.25, "end": 2.55},
          {"text": "piensas,", "start": 2.6, "end": 2.9},
          {"text": "señor", "start": 3.15, "end": 3.45},
          {"text": "Núñez!", "start": 3.5, "end": 3.8},
          {"text": "Mañana", "start": 4.25, "end": 4.55},
          {"text": "te", "start": 4.6, "end": 4.9},
          {"text": "cuento", "start": 4.95, "end": 5.25},
          {"text": "más,", "start": 5.3, "end": 5.6},
          {"text": "¿vale?", "start": 5.85, "end": 6.15},
        ]);

        var RAW_GROUPS = window.__cq.pares(WORDS, 3, 20);
        var GROUPS = RAW_GROUPS.map(function (pair, gi) {
          var ws = pair[0],
            we = pair[1];
          var nextStart =
            gi + 1 < RAW_GROUPS.length ? WORDS[RAW_GROUPS[gi + 1][0]].start : Infinity;
          var gEnd = Math.min(WORDS[we].end + 0.5, nextStart - 0.05);
          return { wordStart: ws, wordEnd: we, start: WORDS[ws].start, end: gEnd };
        });

        var container = document.getElementById("hl-container");
        var tl = gsap.timeline({ paused: true });

        GROUPS.forEach(function (g, gi) {
          var groupWords = WORDS.slice(g.wordStart, g.wordEnd + 1);
          var grp = document.createElement("div");
          grp.className = "hl-group";
          grp.id = "hl-grp-" + gi;

          var groupText = groupWords
            .map(function (w) {
              return w.text.toUpperCase();
            })
            .join(" ");
          var computedSize = fitFontSize(groupText, 80, "800", "Sora", 816);

          groupWords.forEach(function (w, i) {
            var wi = g.wordStart + i;
            var wordEl = document.createElement("span");
            wordEl.className = "hl-word";
            wordEl.id = "hl-w-" + wi;
            wordEl.style.fontSize = computedSize + "px";

            var bgEl = document.createElement("span");
            bgEl.className = "hl-word-bg";
            bgEl.id = "hl-bg-" + wi;

            var textEl = document.createElement("span");
            textEl.className = "hl-word-text";
            textEl.textContent = w.text.toUpperCase();

            wordEl.appendChild(bgEl);
            wordEl.appendChild(textEl);
            grp.appendChild(wordEl);
          });

          container.appendChild(grp);

          tl.set(grp, { visibility: "visible" }, g.start);
          tl.fromTo(
            grp,
            { opacity: 0 },
            { opacity: 1, duration: 0.12, ease: "power2.out" },
            g.start,
          );

          groupWords.forEach(function (w, i) {
            var wi = g.wordStart + i;
            var bgEl = document.getElementById("hl-bg-" + wi);
            var wordEl = document.getElementById("hl-w-" + wi);

            tl.to(bgEl, { opacity: 1, scaleX: 1, duration: 0.15, ease: "power2.out" }, w.start);
            tl.to(
              wordEl,
              { filter: "brightness(1.05)", duration: 0.08, ease: "power2.out" },
              w.start,
            );
            tl.to(
              wordEl,
              { filter: "brightness(1)", duration: 0.16, ease: "power2.out" },
              w.start + 0.08,
            );
            tl.to(bgEl, { opacity: 0, scaleX: 1.02, duration: 0.1, ease: "power2.in" }, w.end);
            tl.set(bgEl, { scaleX: 0 }, w.end + 0.1);
          });

          tl.to(grp, { opacity: 0, duration: 0.1, ease: "power2.in" }, g.end - 0.1);
          tl.set(grp, { opacity: 0, visibility: "hidden" }, g.end);
        });

        tl.seek(0);
        window.__timelines["caption-highlight"] = tl;
      })();
          });
    </script>
</template>
