<template>
  <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      
      #root {
        pointer-events: none;
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      .ne-overlay {
        position: absolute;
        inset: 0;
        background: transparent;
        z-index: 1;
        pointer-events: none;
      }
      #ne-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      .ne-group {
        position: absolute;
        top: 1300px; height: 240px; align-content: center;
        left: 0;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 0 72px;
        opacity: 0;
        visibility: hidden;
      }
      .ne-word {
        font-family: "Archivo", sans-serif;
        font-weight: 900;
        font-size: 96px;
        text-transform: uppercase;
        color: rgba(0, 255, 240, 0.14);
        display: inline-block;
        letter-spacing: 0.04em;
        line-height: 1;
      }
    
  </style>
  <div id="root" data-composition-id="caption-neon-glow" data-width="1080" data-height="1920">
      <div class="ne-overlay"></div>
      <div id="ne-container"></div>
  </div>
  <script>
      // ---- Claqueta: palabras desde palabras.json ({palabra, inicio, fin}) o {text, start, end} ----
      // Pega el contenido de palabras.json en el index.html, en un script suelto: window.PALABRAS = [ ... ];
      // Sin eso se usa la frase de demostracion que trae cada archivo.
      window.__cq = window.__cq || {};
      window.__cq.palabras = function (demo) {
        var raw = window.PALABRAS && window.PALABRAS.length ? window.PALABRAS : demo;
        return raw
          .map(function (p) {
            var a = p.inicio != null ? p.inicio : p.start != null ? p.start : 0;
            var b = p.fin != null ? p.fin : p.end != null ? p.end : a;
            return { text: String(p.palabra || p.text || p.word || "").trim(), start: Number(a) || 0, end: Number(b) || 0 };
          })
          .filter(function (w) { return w.text.length > 0; });
      };
      window.__cq.duracion = function (def) {
        if (!(window.PALABRAS && window.PALABRAS.length)) return def;
        var m = 0;
        window.__cq.palabras([]).forEach(function (w) { m = Math.max(m, w.end); });
        return m + 0.7;
      };
      // Grupos de hasta maxPal palabras y maxCar letras; corta en puntuacion o en pausa >= 0.28 s.
      window.__cq.pares = function (words, maxPal, maxCar) {
        var out = [], ini = 0, car = 0;
        for (var i = 0; i < words.length; i++) {
          car += words[i].text.length + 1;
          var finFrase = /[.!?;:,]$/.test(words[i].text);
          var hueco = i + 1 < words.length ? words[i + 1].start - words[i].end : 0;
          var lleno = i - ini + 1 >= maxPal || (i + 1 < words.length && car + words[i + 1].text.length + 1 > maxCar);
          if (finFrase || hueco >= 0.28 || lleno || i === words.length - 1) { out.push([ini, i]); ini = i + 1; car = 0; }
        }
        return out;
      };
      window.__cq.grupos = function (words, maxPal, maxCar) {
        var p = window.__cq.pares(words, maxPal, maxCar);
        return p.map(function (par, gi) {
          var sig = gi + 1 < p.length ? words[p[gi + 1][0]].start : Infinity;
          return { wordStart: par[0], wordEnd: par[1], start: words[par[0]].start, end: Math.min(words[par[1]].end + 0.5, sig - 0.05) };
        });
      };
      // Palabras de enfasis: 8 letras o mas, o cierre de exclamacion/pregunta.
      window.__cq.claves = function (words) {
        var s = new Set();
        words.forEach(function (w, i) {
          var l = w.text.replace(/[^A-Za-zÀ-ſ0-9]/g, "").length;
          if (l >= 8 || /[!?]$/.test(w.text)) s.add(i);
        });
        return s;
      };
      window.__cq.listo = function (id, fuentes, fn) {
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady[id] = Promise.all(fuentes.map(function (f) { return document.fonts.load(f, "AaÁáÉéÍíÓóÚúÑñ¿¡?!"); })).then(fn);
      };
      window.__cq.listo("caption-neon-glow", ["700 72px Archivo"], function () {
      (function () {
        window.__timelines = window.__timelines || {};

        var _fitCanvas = document.createElement("canvas");
        var _fitCtx = _fitCanvas.getContext("2d");
        function fitFontSize(text, baseFontSize, fontWeight, fontFamily, maxWidth) {
          var size = baseFontSize;
          var minSize = Math.max(44, Math.floor(baseFontSize * 0.45));
          while (size > minSize) {
            _fitCtx.font = fontWeight + " " + size + "px " + fontFamily;
            if (_fitCtx.measureText(text).width <= maxWidth) return size;
            size -= 2;
          }
          return minSize;
        }

        var WORDS = window.__cq.palabras([
          {"text": "¿Cuánto", "start": 0.3, "end": 0.6},
          {"text": "cuesta?", "start": 0.65, "end": 0.95},
          {"text": "¡Más", "start": 1.2, "end": 1.5},
          {"text": "de", "start": 1.55, "end": 1.85},
          {"text": "lo", "start": 1.9, "end": 2.2},
          {"text": "que", "start": 2.25, "end": 2.55},
          {"text": "piensas,", "start": 2.6, "end": 2.9},
          {"text": "señor", "start": 3.15, "end": 3.45},
          {"text": "Núñez!", "start": 3.5, "end": 3.8},
          {"text": "Mañana", "start": 4.25, "end": 4.55},
          {"text": "te", "start": 4.6, "end": 4.9},
          {"text": "cuento", "start": 4.95, "end": 5.25},
          {"text": "más,", "start": 5.3, "end": 5.6},
          {"text": "¿vale?", "start": 5.85, "end": 6.15},
        ]);

        var GROUPS = window.__cq.grupos(WORDS, 3, 18);

        // Keywords get pink glow; others get cyan glow
        var KEYWORDS = window.__cq.claves(WORDS);

        var container = document.getElementById("ne-container");
        var tl = gsap.timeline({ paused: true });

        GROUPS.forEach(function (g, gi) {
          var groupWords = WORDS.slice(g.wordStart, g.wordEnd + 1);
          var groupText = groupWords
            .map(function (w) {
              return w.text.toUpperCase();
            })
            .join(" ");
          var fontSize = fitFontSize(groupText, 96, "900", "'Archivo', sans-serif", 840);
          var grp = document.createElement("div");
          grp.className = "ne-group";
          grp.id = "ne-grp-" + gi;

          groupWords.forEach(function (w, i) {
            var wi = g.wordStart + i;
            var span = document.createElement("span");
            span.className = "ne-word";
            span.id = "ne-w-" + wi;
            span.textContent = w.text;
            span.style.fontSize = fontSize + "px";
            grp.appendChild(span);
          });

          container.appendChild(grp);

          tl.set(grp, { visibility: "visible", opacity: 0 }, g.start);
          tl.fromTo(grp, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "steps(1)" }, g.start);
          tl.fromTo(grp, { x: -8 }, { x: 0, duration: 0.14, ease: "power3.out" }, g.start + 0.05);

          groupWords.forEach(function (w, i) {
            var wi = g.wordStart + i;
            var el = document.getElementById("ne-w-" + wi);
            var isKW = KEYWORDS.has(wi);
            var activeColor = isKW ? "#FF0099" : "#00FFF0";
            tl.to(
              el,
              {
                color: activeColor,
                textShadow:
                  "0 0 10px " +
                  activeColor +
                  ", 0 0 35px " +
                  activeColor +
                  ", 0 0 90px " +
                  activeColor,
                duration: 0.06,
              },
              w.start,
            );
            tl.to(el, { color: "rgba(0,255,240,0.14)", textShadow: "none", duration: 0.06 }, w.end);
          });

          tl.to(grp, { opacity: 0, x: 6, duration: 0.1, ease: "steps(1)" }, g.end - 0.1);
          tl.set(grp, { opacity: 0, visibility: "hidden" }, g.end);
        });

        window.__timelines["caption-neon-glow"] = tl;
      })();
          });
    </script>
</template>
