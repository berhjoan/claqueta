<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: transparent; }
    #sh-glitch-cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  </style>
  <div id="root" data-composition-id="sh-glitch" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"desde","type":"string","label":"Imagen fija de la escena A","default":"assets/escA.png"},
      {"id":"hasta","type":"string","label":"Imagen fija de la escena B","default":"assets/escB.png"},
      {"id":"duracion","type":"number","label":"Duracion de la transicion (s)","default":1.0,"min":0.3,"max":3,"step":0.05,"unit":"s"}
    ]'>
    <canvas id="sh-glitch-cv" width="1080" height="1920"></canvas>
  </div>
  <script>
    (function () {
      var vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
      var SRC_A = vars.desde || "assets/escA.png";
      var SRC_B = vars.hasta || "assets/escB.png";
      var D = Number(vars.duracion) > 0 ? Number(vars.duracion) : 1.0;
      var glCanvas = document.getElementById("sh-glitch-cv");
      var gl = glCanvas.getContext("webgl", { preserveDrawingBuffer: true });
      window.__timelines = window.__timelines || {};
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      if (!gl) { console.warn("WebGL no disponible"); window.__timelines["sh-glitch"] = gsap.timeline({ paused: true }); return; }
      gl.viewport(0, 0, 1080, 1920);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      // ---- tramo tomado tal cual del bloque `glitch` (GLSL y programas) ----
var vertSrc =
          "attribute vec2 a_pos; varying vec2 v_uv; void main(){" +
          "v_uv=a_pos*0.5+0.5; v_uv.y=1.0-v_uv.y; gl_Position=vec4(a_pos,0,1);}";
        var quadBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
          gl.STATIC_DRAW,
        );
        function compileShader(src, type) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            console.error("Shader:", gl.getShaderInfoLog(s));
          return s;
        }
        function mkProg(fragSrc) {
          var p = gl.createProgram();
          gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
          gl.attachShader(p, compileShader(fragSrc, gl.FRAGMENT_SHADER));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS))
            console.error("Link:", gl.getProgramInfoLog(p));
          return p;
        }

        var H =
          "precision mediump float;" +
          "varying vec2 v_uv;" +
          "uniform sampler2D u_from, u_to;" +
          "uniform float u_progress;" +
          "uniform vec2 u_resolution;\n";

        var progPass = mkProg(H + "void main(){gl_FragColor=texture2D(u_from,v_uv);}");
        var progTrans = mkProg(
          H +
            "float rand(vec2 co){return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453);}void main(){float inten=u_progress*(1.-u_progress)*4.;float lineY=floor(v_uv.y*60.)/60.;float lineDisp=(rand(vec2(lineY,floor(u_progress*17.)))-.5)*.18*inten;vec2 block=floor(v_uv*vec2(12.,8.));float br=rand(block+vec2(floor(u_progress*11.)));float ba=step(.83,br)*inten;vec2 bd=(vec2(rand(block*2.1),rand(block*3.7))-.5)*.35*ba;vec2 uv=clamp(v_uv+vec2(lineDisp,0.)+bd,0.,1.);float shift=inten*.035;float r=texture2D(u_from,uv+vec2(shift,0.)).r;float g=texture2D(u_from,uv).g;float b=texture2D(u_from,uv-vec2(shift,0.)).b;vec3 col=vec3(r,g,b);col-=step(.5,fract(v_uv.y*u_resolution.y*.5))*.05*inten;col*=1.+(rand(vec2(floor(u_progress*23.)))-.5)*.3*inten;float levels=mix(256.,8.,inten*.5);col=floor(col*levels)/levels;gl_FragColor=mix(vec4(col,1.),texture2D(u_to,v_uv),u_progress);}",
        );

        
      // ---- fin del tramo del bloque ----
      function loadTex(src) {
        return new Promise(function (ok, fail) {
          var img = new Image();
          img.onload = function () {
            var tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
            ok(tex);
          };
          img.onerror = function () { fail(new Error("no carga " + src)); };
          img.src = src;
        });
      }
      function draw(prog, texFrom, texTo, progress) {
        gl.useProgram(prog);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texFrom);
        gl.uniform1i(gl.getUniformLocation(prog, "u_from"), 0);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texTo);
        gl.uniform1i(gl.getUniformLocation(prog, "u_to"), 1);
        gl.uniform1f(gl.getUniformLocation(prog, "u_progress"), progress);
        gl.uniform2f(gl.getUniformLocation(prog, "u_resolution"), 1080, 1920);
        var pos = gl.getAttribLocation(prog, "a_pos");
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.enableVertexAttribArray(pos);
        gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      window.__hf.buildReady["sh-glitch"] = Promise.all([loadTex(SRC_A), loadTex(SRC_B)]).then(function (t) {
        var A = t[0], B = t[1];
        var st = { p: 0 };
        function paint() {
          var p = st.p;
          if (p <= 0.0005) draw(progPass, A, A, 0);
          else if (p >= 0.9995) draw(progPass, B, B, 0);
          else draw(progTrans, A, B, p);
        }
        var tl = gsap.timeline({ paused: true, onUpdate: paint });
        tl.fromTo(st, { p: 0 }, { p: 1, duration: D, ease: "power2.inOut", onUpdate: paint }, 0);
        paint();
        window.__timelines["sh-glitch"] = tl;
      });
    })();
  </script>
</template>
